<!DOCTYPE html>
<html>

<head>

    <title>Student Attendance</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav class="navbar">

    <div class="logo">
        QR Attendance
    </div>

</nav>


<div class="container">

    <div class="card">

        <div class="center">

            <h1>
                Mark Attendance
            </h1>

            <p class="subtitle">
                {{ session["subject_name"] }}
                -
                Lecture {{ session["lecture_number"] }}
            </p>

        </div>


        <div class="success">

            Present:

            {{ session["attendance_count"] }}

            /

            {{ session["student_limit"] }}

        </div>


        <form
            action="{{ url_for('submit_attendance') }}"
            method="POST"
        >

            <input
                type="hidden"
                name="session_id"
                value="{{ session['session_id'] }}"
            >


            <div class="form-group">

                <label>
                    Student Name
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Roll Number
                </label>

                <input
                    type="text"
                    name="roll_number"
                    placeholder="Enter roll number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Department
                </label>

                <input
                    type="text"
                    name="department"
                    placeholder="Enter department"
                    required
                >

            </div>


            <button
                class="button button-green"
                type="submit"
            >
                Mark Attendance
            </button>

        </form>

    </div>

</div>

</body>

</html>
